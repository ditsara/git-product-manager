services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    userns_mode: keep-id
    volumes:
      - ..:/workspace:cached,z
      - copilot-config:/home/vscode/.copilot
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  copilot-config:    # Persists Copilot CLI auth
